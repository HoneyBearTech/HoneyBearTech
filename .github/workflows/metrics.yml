name: Metrics

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Each step renders one panel as its own SVG on the `metrics` branch,
# so the README can place each panel in the section it belongs to.
jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Notable contributions
        uses: HoneyBearTech/metrics@48ae553714a50b66b74b521cb3dd1be7b043784e # master
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          committer_branch: metrics
          filename: metrics.notable.svg
          base: ""
          plugin_notable: yes
          plugin_notable_from: all
          plugin_notable_types: commit, pull_request
          plugin_notable_repositories: yes

      - name: Languages
        uses: HoneyBearTech/metrics@48ae553714a50b66b74b521cb3dd1be7b043784e # master
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          committer_branch: metrics
          filename: metrics.languages.svg
          base: ""
          plugin_languages: yes
          plugin_languages_sections: most-used, recently-used
          plugin_languages_details: percentage

      - name: Achievements
        uses: HoneyBearTech/metrics@48ae553714a50b66b74b521cb3dd1be7b043784e # master
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          committer_branch: metrics
          filename: metrics.achievements.svg
          base: ""
          plugin_achievements: yes
          plugin_achievements_display: compact
